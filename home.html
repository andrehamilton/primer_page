<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroData Anonimo</title>
  <link rel="stylesheet" href="home.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-config.js?v=2"></script>
  <script defer src="home.js"></script>
</head>
<body>
  <main class="app-shell">
    <aside class="left-nav" aria-label="Navegacion">
      <a class="app-logo" href="home.html" aria-label="Inicio">R</a>
      <nav>
        <button class="is-active" type="button"><span>H</span>Inicio</button>
        <button type="button"><span>B</span>Buscar</button>
        <button type="button"><span>N</span>Notificaciones</button>
        <button type="button"><span>M</span>Mensajes</button>
        <button type="button"><span>G</span>Guardados</button>
        <button type="button"><span>P</span>Perfil anonimo</button>
      </nav>
      <button class="primary-post" id="sidePostButton" type="button">Publicar</button>
      <button class="logout-button" id="logoutButton" type="button">Cerrar sesion</button>
    </aside>

    <section class="timeline" aria-label="Timeline anonimo">
      <header class="timeline-header">
        <div>
          <h1>Inicio</h1>
          <p>Publicaciones y comentarios anonimos</p>
        </div>
        <label class="search-box" aria-label="Buscar publicaciones">
          <span>#</span>
          <input id="searchInput" type="search" placeholder="Buscar temas">
        </label>
      </header>

      <section class="composer" aria-label="Crear publicacion anonima">
        <div class="anon-avatar" aria-hidden="true">?</div>
        <form id="postForm">
          <textarea id="postText" maxlength="280" rows="4" placeholder="Que esta pasando? Publica sin mostrar tu nombre."></textarea>
          <div class="composer-footer">
            <div class="composer-tools" aria-label="Opciones">
              <button type="button" data-template="Opinion anonima: ">Opinion</button>
              <button type="button" data-template="Pregunta anonima: ">Pregunta</button>
              <button type="button" data-template="Confesion anonima: ">Confesion</button>
            </div>
            <div class="post-submit">
              <span id="postCounter">0/280</span>
              <button type="submit">Publicar</button>
            </div>
          </div>
        </form>
      </section>

      <section class="feed" id="feed" aria-label="Publicaciones"></section>
    </section>

    <aside class="right-panel" aria-label="Informacion">
      <section class="panel-card">
        <h2>Que esta pasando</h2>
        <button type="button" data-search="anonimo">
          <span>Tendencia</span>
          <strong>#Anonimo</strong>
          <small>128 publicaciones</small>
        </button>
        <button type="button" data-search="universidad">
          <span>Comunidad</span>
          <strong>#Universidad</strong>
          <small>82 publicaciones</small>
        </button>
        <button type="button" data-search="opinion">
          <span>Debate</span>
          <strong>#Opinion</strong>
          <small>55 publicaciones</small>
        </button>
      </section>

      <section class="panel-card">
        <h2>Modo anonimo</h2>
        <p>Tu nombre no aparece en los posts ni en los comentarios. Todo se muestra como Anonimo.</p>
      </section>
    </aside>
  </main>

  <button class="floating-post" id="floatingPostButton" type="button" aria-label="Crear publicacion">+</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
